<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/newsreader.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#1E1D1A;font-family:'Inter',sans-serif;color:#F4EFE6}
  .abs{position:absolute}
  .serif{font-family:'Newsreader',Georgia,serif;letter-spacing:-0.02em}
  .compteur{left:0;right:0;top:120px;text-align:center}
  .compteur small{display:block;font:600 28px 'Inter';letter-spacing:.2em;text-transform:uppercase;color:#9C968B}
  .compteur b{display:block;margin-top:34px;font:400 150px 'Newsreader',serif;color:#E58B6A;font-variant-numeric:tabular-nums}
  .pile{left:0;right:0;top:470px;display:flex;justify-content:center;gap:18px}
  .pile span{font:500 26px 'Inter';padding:14px 24px;border-radius:30px;background:#2A2925;border:1px solid #3A3832;color:#8E887D}
  .carte{left:110px;right:110px;top:620px;height:680px;background:#2A2925;border:1px solid #3A3832;border-radius:48px;
    box-shadow:0 50px 100px rgba(0,0,0,.45);transform:rotate(-2deg);padding:70px}
  .carte .ico{width:130px;height:130px;border-radius:34px;background:#3A2A22;display:grid;place-items:center;font-size:72px}
  .carte h2{margin-top:50px;font-size:96px;line-height:1.02;font-weight:400}
  .carte p{margin-top:24px;font:500 34px 'Inter';color:#8E887D}
  .tampon{right:60px;top:1210px;transform:rotate(8deg);border:6px solid #E58B6A;color:#E58B6A;border-radius:30px;
    padding:18px 40px;font:700 92px 'Inter';letter-spacing:-0.02em;background:#1E1D1A}
  .st{left:70px;right:70px;bottom:230px;text-align:center;font:700 62px/1.16 'Inter Display','Inter';color:#F4EFE6}
  .st em{font-style:italic;color:#E58B6A}
  .tag{left:80px;bottom:100px;font:600 24px 'Inter';letter-spacing:.18em;text-transform:uppercase;color:#6B675F}
</style>
</head>
<body>
  <div class="abs compteur"><small>Temps perdu cette semaine</small><b>2 h 45</b></div>
  <div class="abs pile"><span>✉️ Mail · 45 min</span><span>📄 CV · 2 h</span></div>
  <div class="abs carte">
    <div class="ico">📑</div>
    <h2 class="serif">Comprendre un contrat de 14&nbsp;pages</h2>
    <p>Le bail, l'assurance, le forfait…</p>
  </div>
  <div class="abs tampon">+1 h 30</div>
  <div class="abs st">Pour comprendre un <em>contrat de quatorze pages</em>&nbsp;?</div>
  <div class="abs tag">Nouvelle accroche · élément 3 sur 5</div>
</body>
</html>
